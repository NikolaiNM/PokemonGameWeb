<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Битва | Битва Покемонов</title>
    <style>
        /* === ТЕ ЖЕ СТИЛИ, ЧТО И В GAME.HTML ДЛЯ ЕДИНООБРАЗИЯ === */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card h2 {
            margin-top: 0;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 10px;
            color: #2c3e50;
            font-size: 1.4rem;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-green { background-color: #2ecc71; color: white; }
        .btn-blue { background-color: #3498db; color: white; }
        .btn-red { background-color: #e74c3c; color: white; }
        .btn-orange { background-color: #f39c12; color: white; }
        .btn-gray { background-color: #95a5a6; color: white; }

        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* === СПЕЦИФИЧНЫЕ СТИЛИ ДЛЯ БИТВЫ === */
        .enemy-card {
            background: #fff5f5;
            border: 1px solid #fed7d7;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .enemy-card h3 {
            margin: 0;
            color: #c53030;
            font-size: 1.2rem;
        }

        /* Стилизация выпадающего списка под input */
        select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            flex-grow: 1;
            background-color: white;
            cursor: pointer;
        }
        select:focus {
            outline: none;
            border-color: #3498db;
        }

        .active-pokemon-tag {
            display: inline-block;
            background: #e6fffa;
            color: #234e52;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-right: 8px;
            margin-bottom: 8px;
            border: 1px solid #b2f5ea;
        }

        .no-active-message {
            background-color: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

<!-- === КАРТОЧКА 1: ТВОЯ АКТИВНАЯ КОМАНДА (Сводка) === -->
<div class="card">
    <h2>🎒 Твоя активная команда</h2>
    <div th:if="${#lists.isEmpty(trainer.getPokemons().?[isActive()])}">
        <p class="no-active-message">😱 Все твои покемоны в нокауте! Вернись и загрузи сохранение.</p>
    </div>
    <div th:unless="${#lists.isEmpty(trainer.getPokemons().?[isActive()])}">
        <div class="flex-row" style="flex-wrap: wrap;">
                <span th:each="p : ${trainer.getPokemons()}"
                      th:if="${p.isActive()}"
                      class="active-pokemon-tag">
                    <b th:text="${p.getName()}"></b>
                    <small>(Ур.<span th:text="${p.getLevel()}"></span>, Атк.<span th:text="${p.getAttack()}"></span>)</small>
                </span>
        </div>
    </div>
</div>

<!-- === КАРТОЧКА 2: ВЫБОР ПРОТИВНИКА === -->
<div class="card">
    <h2>⚔️ Дикие покемоны появились!</h2>

    <div th:if="${#lists.isEmpty(trainer.getPokemons().?[isActive()])}">
        <!-- Если некем драться, скрываем формы -->
    </div>

    <div th:unless="${#lists.isEmpty(trainer.getPokemons().?[isActive()])}">
        <p style="margin-bottom: 20px; color: #666;">Выбери, кто будет сражаться, и нажми "В бой!":</p>

        <!-- Список диких покемонов -->
        <div th:each="wild, iterStat : ${wildPokemons}" class="enemy-card">
            <h3>
                <span th:text="${iterStat.index + 1}"></span>.
                <span th:text="${wild.getName()}"></span>
                <small style="color: #666; font-weight: normal;">(Уровень: <span th:text="${wild.getLevel()}"></span>)</small>
            </h3>

            <!-- Форма атаки -->
            <form action="/attack" method="post" class="flex-row">
                <label for="select-[[${iterStat.index}]]" style="font-weight: bold; white-space: nowrap;">Кто атакует:</label>

                <select name="myPokemonName" id="select-[[${iterStat.index}]]" required>
                    <option value="" disabled selected>-- Выбери покемона --</option>
                    <option th:each="p : ${trainer.getPokemons()}"
                            th:if="${p.isActive()}"
                            th:value="${p.getName()}"
                            th:text="${p.getName() + ' (Ур.' + p.getLevel() + ', Атк.' + p.getAttack() + ')'}">
                    </option>
                </select>

                <!-- Скрытое поле с ID врага -->
                <input type="hidden" name="enemyId" th:value="${iterStat.index}">

                <button type="submit" class="btn btn-red" style="white-space: nowrap;">🔥 В бой!</button>
            </form>
        </div>
    </div>
</div>

<!-- === НАВИГАЦИЯ === -->
<div style="text-align: center; margin-top: 30px;">
    <form action="/game" method="get" style="display: inline;">
        <button type="submit" class="btn btn-gray">🏃 Убежать и вернуться к статусу</button>
    </form>
</div>

</body>
</html>
